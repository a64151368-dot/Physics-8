<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш маршрут — карти фізики 7 і 8 класу</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ overflow:hidden; background:#F6F3FA; font-family:system-ui, 'Segoe UI', Roboto, sans-serif; }

  /* обидві карти на весь екран; видно лише вибрану */
  .map{ position:fixed; inset:0; width:100%; height:100%; border:0; display:block; visibility:hidden; }
  .map.on{ visibility:visible; }

  /* перемикач унизу по центру */
  #bar{ position:fixed; z-index:2; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%);
        display:flex; align-items:center; gap:4px; padding:5px;
        background:rgba(255,255,255,.95); border-radius:999px; box-shadow:0 6px 22px rgba(40,40,80,.24); white-space:nowrap; }
  #bar a, #bar button{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 18px;
        border:0; border-radius:999px; background:none; color:#3A3550; font:600 17px/1 system-ui, 'Segoe UI', Roboto, sans-serif;
        text-decoration:none; cursor:pointer; transition:background .2s, color .2s; }
  #bar a:hover, #bar button:hover{ background:#EFEAF8; }
  #bar .home{ padding:0 14px; color:#5B5470; }
  #bar .sep{ width:1px; height:26px; background:#DDD6EC; margin:0 2px; }
  #bar button[aria-pressed="true"]{ color:#FFFFFF; }
  #bar button[data-map="7"][aria-pressed="true"]{ background:#C9573A; }
  #bar button[data-map="8"][aria-pressed="true"]{ background:#5B3F9A; }
  #bar a:focus-visible, #bar button:focus-visible{ outline:3px solid #5B3F9A; outline-offset:2px; }
  @media (max-width:420px){ #bar a, #bar button{ padding:0 13px; font-size:16px; } #bar .home span{ display:none; } }
</style>
</head>
<body>
  <!-- Карти лежать поруч у файлах karta-7.html і karta-8.html -->
  <iframe class="map" id="m7" title="Карта фізики 7 клас" data-src="karta-7.html"></iframe>
  <iframe class="map" id="m8" title="Карта фізики 8 клас" data-src="karta-8.html"></iframe>

  <nav id="bar" aria-label="Вибір карти">
    <a class="home" href="index.html" aria-label="Повернутися на обкладинку">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 L6.5 10 L12.5 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Обкладинка</span>
    </a>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-map="7" aria-pressed="false">7 клас</button>
    <button type="button" data-map="8" aria-pressed="false">8 клас</button>
  </nav>

<script>
(function(){
  var DEFAULT = '7';                       // яку карту показувати першою
  var frames = { '7': document.getElementById('m7'), '8': document.getElementById('m8') };
  var buttons = document.querySelectorAll('#bar button[data-map]');

  function show(id, focus){
    if (!frames[id]) id = DEFAULT;
    var f = frames[id];
    if (!f.getAttribute('src')) f.setAttribute('src', f.dataset.src);   // карта вантажиться, коли її вперше відкривають
    for (var k in frames) frames[k].classList.toggle('on', k === id);
    Array.prototype.forEach.call(buttons, function(b){ b.setAttribute('aria-pressed', b.dataset.map === id ? 'true' : 'false'); });
    document.title = 'Карта фізики ' + id + ' клас';
    if (history.replaceState) history.replaceState(null, '', '#' + id); // посилання karta.html#8 одразу відкриває 8 клас
    if (focus) { try { f.focus(); } catch(e) {} }
  }

  Array.prototype.forEach.call(buttons, function(b){
    b.addEventListener('click', function(){ show(b.dataset.map, true); });
  });

  // Esc усередині карти — назад на обкладинку
  addEventListener('message', function(e){ if (e.data === 'fizyka-back') location.href = 'index.html'; });
  addEventListener('keydown', function(e){ if (e.key === 'Escape') location.href = 'index.html'; });

  show((location.hash || '').replace('#', '') || DEFAULT, false);
  // друга карта підвантажується у фоні, щоб перемикання було миттєвим
  setTimeout(function(){ for (var k in frames) if (!frames[k].getAttribute('src')) frames[k].setAttribute('src', frames[k].dataset.src); }, 1500);
})();
</script>
</body>
</html>
