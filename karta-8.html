  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ overflow:hidden; background:#EEF2FB; font-family:'Marmelad', system-ui, sans-serif; color:#26304A; overscroll-behavior:none; }
  #viewport{ position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  #viewport.dragging{ cursor:grabbing; }
  #world{ position:absolute; left:0; top:0; transform-origin:0 0; }
  #world.anim{ transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:focus-visible{ outline:3px solid #3E5BA9; outline-offset:4px; border-radius:10px; }

  /* ── теми: дорожні вказівники ── */
  .topic{ display:inline-flex; align-items:center; height:52px; font-family:'Pacifico', cursive; font-weight:400; font-size:26px; line-height:1; letter-spacing:.01em; color:#26304A;
    background:#FFFFFF; border:3px solid var(--hd); border-radius:10px; cursor:inherit;
    box-shadow: 0 3px 0 var(--hd), 0 8px 14px rgba(61,77,122,.16); transition: transform .15s, background .2s; }
  .topic .tt{ padding:0 18px 3px; }
  .sign.sl{ border-left-width:10px; border-radius:10px 22px 22px 10px; }
  .sign.sr{ border-right-width:10px; border-radius:22px 10px 10px 22px; }
  .topic.has-link{ cursor:pointer; }
  .topic.has-link:hover{ transform: translateY(-2px); background:var(--hl); }
  .tlabel{ cursor:pointer; }
  .camp .tap{ animation: tap 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tap{ 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.15) } }

  /* ── анімації ── */
  @keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
  .sym{animation:float 6s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:skewY(0deg) scaleX(1)}50%{transform:skewY(-5deg) scaleX(.94)}}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.6s ease-in-out infinite}
  .pennant{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.9s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}
  @keyframes drift2{0%,100%{transform:translateX(0)}50%{transform:translateX(-80px)}}
  .cloud.c1{animation:drift1 26s ease-in-out infinite} .cloud.c2{animation:drift2 30s ease-in-out infinite}
  @keyframes fall{0%{transform:translate(0,-40px)}50%{transform:translate(22px,660px)}100%{transform:translate(-6px,1360px)}}
  .flake{animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite}
  @keyframes soar{0%,100%{transform:translate(0,0)}25%{transform:translate(-120px,40px)}50%{transform:translate(-240px,-10px)}75%{transform:translate(-110px,-40px)}}
  .soar{animation:soar 22s ease-in-out infinite}

  /* ── картка теми ── */
  #card{ position:fixed; z-index:6; right:16px; top:50%; transform:translateY(-50%); width:min(420px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto;
    background:#FFFFFF; border-radius:26px; box-shadow:0 14px 40px rgba(70,60,110,.28); border:4px solid var(--fl); }
  #card.show{ animation: cardIn .35s cubic-bezier(.2,1.3,.4,1); }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(-50%) scale(.9) } to{ opacity:1; transform:translateY(-50%) scale(1) } }
  #cardClose{ position:sticky; top:8px; float:right; margin:8px 8px 0 0; width:44px; height:44px; border-radius:50%; background:var(--hl); color:var(--dk); font-size:30px; line-height:44px; }
  #cardBody{ padding:18px 22px 22px; }
  #cardBody h2{ font-family:'Pacifico', cursive; font-weight:400; font-size:32px; line-height:46px; color:var(--dk); margin-bottom:6px; }
  #cardBody h3{ font-family:'Rubik', sans-serif; font-weight:700; font-size:20px; line-height:26px; letter-spacing:.02em; color:var(--dk); margin-top:12px; }
  #cardBody .fl{ list-style:none; display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  #cardBody .fl li{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; background:var(--hl); border-radius:14px; padding:8px 14px; }
  #cardBody .fx{ font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:26px; font-weight:400; color:#26304A; }
  #cardBody .fl span, #cardBody p{ font-family:'Marmelad', sans-serif; font-size:20px; line-height:27px; color:#3F3A50; }
  #cardBody .quiz{ margin-top:14px; padding:12px 14px 14px; border-radius:16px; border:3px dashed var(--fl); }
  #cardBody .quiz h3{ margin-top:0; }
  #cardBody .reveal{ margin-top:10px; padding:8px 16px; border-radius:999px; background:var(--dk); color:#FFFFFF; font-size:20px; min-height:44px; }
  #cardBody .ans{ margin-top:10px; padding:10px 12px; background:var(--hl); border-radius:12px; }
  @media (max-width:640px){
    #card{ right:8px; left:8px; width:auto; top:auto; bottom:8px; transform:none; max-height:70vh; }
    #card.show{ animation:none; }
  }


  /* ── кнопка СТАРТ ── */
  #startBtn{ position:absolute; left:875px; top:1208px; width:200px; height:72px; z-index:5; display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'Pacifico', cursive; font-size:36px; line-height:1; color:#FFFFFF; letter-spacing:.02em;
    background:linear-gradient(180deg,#5BC26A 0%,#2F9A48 100%); border:4px solid #FFFFFF; border-radius:999px;
    box-shadow:0 5px 0 #1F6E33, 0 12px 22px rgba(38,48,74,.35); text-shadow:0 2px 0 rgba(31,110,51,.7);
    cursor:pointer; animation:startPulse 2s ease-in-out infinite; transition:transform .15s; }
  #startBtn:hover{ transform:translateY(-3px) scale(1.04); }
  #startBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #1F6E33, 0 6px 12px rgba(38,48,74,.3); }
  #startBtn .play{ width:0; height:0; border-left:22px solid #FFFFFF; border-top:13px solid transparent; border-bottom:13px solid transparent; margin-top:2px; filter:drop-shadow(0 2px 0 rgba(31,110,51,.7)); }
  #startBtn .st{ padding-bottom:6px; }
  @keyframes startPulse{ 0%,100%{ box-shadow:0 5px 0 #1F6E33, 0 12px 22px rgba(38,48,74,.35), 0 0 0 0 rgba(91,194,106,.55) } 50%{ box-shadow:0 5px 0 #1F6E33, 0 12px 22px rgba(38,48,74,.35), 0 0 0 16px rgba(91,194,106,0) } }

  @media (prefers-reduced-motion: reduce){ #world.anim{ transition:none; } #map *, #card, #startBtn{ animation:none !important; } }
</style>
</head>

<script>
(function(){
  var vp=document.getElementById('viewport'), world=document.getElementById('world');
  
  var MW=1900, MH=1300;
  var s=1, x=0, y=0, fitS=1, MIN=0.2, MAX=6;

  function apply(anim){
    world.classList.toggle('anim', !!anim);
    world.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';
  }
  function clampPan(){
    var W=vp.clientWidth, H=vp.clientHeight, w=MW*s, h=MH*s;
    // карта не «з'їжджає» з екрана: якщо менша за екран — по центру, якщо більша — без порожніх країв
    x = w<=W ? (W-w)/2 : Math.min(0, Math.max(W-w, x));
    y = h<=H ? (H-h)/2 : Math.min(0, Math.max(H-h, y));
  }
  function fit(anim){
    var W=vp.clientWidth, H=vp.clientHeight;
    fitS=Math.min(W/MW, H/MH);           /* уся карта на весь екран */
    MIN=fitS; MAX=fitS*6;
    s=fitS; x=(W-MW*s)/2; y=(H-MH*s)/2;
    apply(anim);
  }
  function zoomAt(cx, cy, ns, anim){
    ns=Math.min(MAX, Math.max(MIN, ns));
    var k=ns/s; x=cx-(cx-x)*k; y=cy-(cy-y)*k; s=ns;
    clampPan(); apply(anim);
  }
  function center(){ return [vp.clientWidth/2, vp.clientHeight/2]; }
  function hideHint(){}

  // коліщатко миші / жест на тачпаді
  vp.addEventListener('wheel', function(e){
    e.preventDefault(); hideHint();
    var r=vp.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
    var dy=e.deltaMode===1? e.deltaY*16 : e.deltaY;
    if(!e.ctrlKey && Math.abs(e.deltaX)>Math.abs(dy)*1.5){ x-=e.deltaX; clampPan(); apply(false); return; }
    var f=Math.exp(-dy*(e.ctrlKey?0.01:0.0018)); f=Math.min(1.3, Math.max(0.77, f));
    zoomAt(cx, cy, s*f, false);
  }, {passive:false});

  // перетягування і щипок двома пальцями
  var pts=new Map(), last=null, pinch=null, moved=0, lastTap=0;
  vp.addEventListener('pointerdown', function(e){
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size===1){ last={x:e.clientX, y:e.clientY}; moved=0; vp.classList.add('dragging'); }
    if(pts.size===2){
      var a=[...pts.values()];
      pinch={d:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y), s:s};
    }
    hideHint();
  });
  vp.addEventListener('pointermove', function(e){
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    var r=vp.getBoundingClientRect();
    if(pts.size>=2 && pinch){
      var a=[...pts.values()], d=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
      var mx=(a[0].x+a[1].x)/2-r.left, my=(a[0].y+a[1].y)/2-r.top;
      if(last){ x+=mx-last.x; y+=my-last.y; }
      last={x:mx, y:my};
      zoomAt(mx, my, pinch.s*d/pinch.d, false);
      moved+=10;
    } else if(pts.size===1 && last){
      var dx=e.clientX-last.x, dy=e.clientY-last.y;
      moved+=Math.abs(dx)+Math.abs(dy);
      x+=dx; y+=dy; last={x:e.clientX, y:e.clientY};
      clampPan(); apply(false);
    }
  });
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===1){ var p=[...pts.values()][0]; last={x:p.x, y:p.y}; }
    if(pts.size===0){
      last=null; vp.classList.remove('dragging');
      // подвійне торкання — наблизити
      if(e.type==='pointerup' && moved<8){
        var now=Date.now(), r=vp.getBoundingClientRect();
        if(window.__uiTap){ lastTap=0; } else if(now-lastTap<320){ zoomAt(e.clientX-r.left, e.clientY-r.top, s*2, true); lastTap=0; }
        else lastTap=now;
      }
    }
  }
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);
  vp.addEventListener('dblclick', function(e){ e.preventDefault(); });


  // клавіатура: + − 0 і стрілки
  addEventListener('keydown', function(e){
    var c=center(), st=60;
    if(e.key==='+'||e.key==='='){ zoomAt(c[0],c[1],s*1.25,true); }
    else if(e.key==='-'||e.key==='_'){ zoomAt(c[0],c[1],s/1.25,true); }
    else if(e.key==='0'){ fit(true); }
    else if(e.key==='Escape'){ if(window.parent!==window){ parent.postMessage('fizyka-back','*'); } else { history.length>1 ? history.back() : (location.href='index.html'); } }
    else if(e.key==='ArrowLeft'){ x+=st; clampPan(); apply(true); }
    else if(e.key==='ArrowRight'){ x-=st; clampPan(); apply(true); }
    else if(e.key==='ArrowUp'){ y+=st; clampPan(); apply(true); }
    else if(e.key==='ArrowDown'){ y-=st; clampPan(); apply(true); }
    else return;
    hideHint(); e.preventDefault();
  });

  var rz; addEventListener('resize', function(){ clearTimeout(rz); rz=setTimeout(function(){ fit(false); }, 120); });
  fit(false);
})();

</script>
<script>

  var DATA = {"themes": [{"name": "Робота і потужність", "dark": "#5B3F9A", "fill": "#B5A3E6", "light": "#DCD2F5", "f": [["A = F·s", "механічна робота"], ["N = A / t", "потужність"]], "u": "Дж (джоуль), Вт (ват); 1 кВт = 1000 Вт", "q": "Двоє лижників однакової маси піднялися на ту саму гору: один за 10 хв, інший за 20 хв. Хто виконав більшу роботу? У кого більша потужність?", "a": "Роботу вони виконали однакову: маса й висота ті самі. Потужність більша в того, хто піднявся швидше, тобто за 10 хв."}, {"name": "Механічна енергія", "dark": "#1D6A60", "fill": "#7FD1C4", "light": "#BDE8E0", "f": [["Eп = mgh", "потенційна енергія"], ["Eк = mv²/2", "кінетична енергія"], ["Eп + Eк = const", "якщо немає тертя"]], "u": "Дж (джоуль)", "q": "Санчата з'їжджають із гірки. Яка енергія перетворюється на яку?", "a": "Потенційна енергія санчат зменшується, а кінетична збільшується. Частина енергії йде на подолання тертя об сніг."}, {"name": "Прості механізми", "dark": "#2F6B2A", "fill": "#9BD39A", "light": "#C9E9C6", "f": [["M = F·d", "момент сили"], ["F₁d₁ = F₂d₂", "рівновага важеля"], ["η = Aкор / Aповн · 100%", "ККД"]], "u": "Н·м; рухомий блок дає виграш у силі у 2 рази", "q": "Чому дверна ручка розміщена якомога далі від завіс?", "a": "Що більше плече сили, то меншу силу треба прикласти, щоб створити той самий момент сили й відчинити двері."}, {"name": "Теплопередача", "dark": "#A24A1F", "fill": "#F6A97A", "light": "#FAD0B5", "f": [["T = t + 273", "температура за шкалою Кельвіна"]], "u": "°C, К. Види теплопередачі: теплопровідність, конвекція, випромінювання", "q": "Чому взимку металева гойдалка на дотик холодніша за дерев'яну, хоча температура в них однакова?", "a": "Метал добре проводить тепло й швидко забирає його від руки. Дерево проводить тепло погано, тому здається теплішим."}, {"name": "Кількість теплоти", "dark": "#A3283D", "fill": "#F28B9B", "light": "#F8C0C9", "f": [["Q = cm(t₂ − t₁)", "нагрівання й охолодження"], ["Qвідд = Qотр", "рівняння теплового балансу"]], "u": "Дж; питома теплоємність c — Дж/(кг·°C)", "q": "Що нагріється швидше на однаковому вогні: 1 кг води чи 1 кг олії?", "a": "Олія. Її питома теплоємність менша, ніж у води, тож для нагрівання на ті самі градуси їй потрібно менше теплоти."}, {"name": "Агрегатні стани", "dark": "#23608A", "fill": "#8CC9E8", "light": "#C3E3F4", "f": [["Q = λm", "плавлення і кристалізація"]], "u": "Дж; питома теплота плавлення λ — Дж/кг; лід плавиться при 0 °C", "q": "Чому температура суміші снігу й води не підвищується, доки весь сніг не розтане?", "a": "Уся теплота, яку отримує суміш, іде на плавлення снігу, а не на нагрівання. Тому температура тримається 0 °C."}], "total": 14};
  var vp = document.getElementById('viewport');
  Array.prototype.forEach.call(document.querySelectorAll('.topic'), function(b){
    if (LINKS[b.dataset.topic]) b.classList.add('has-link'); else b.setAttribute('tabindex', '-1');
  });

  // ── theme card ──
  var card = document.getElementById('card'), body = document.getElementById('cardBody');
  var openIdx = -1;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function openCard(i){
    var t = DATA.themes[i]; openIdx = i;
    card.style.setProperty('--dk', t.dark); card.style.setProperty('--hl', t.light); card.style.setProperty('--fl', t.fill);
    var f = t.f.map(function(r){ return '<li><b class="fx">' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></li>'; }).join('');
    body.innerHTML = '<h2>' + esc(t.name) + '</h2>' +
      '<h3>Головні формули</h3><ul class="fl">' + f + '</ul>' +
      '<h3>Одиниці</h3><p class="un">' + esc(t.u) + '</p>' +
      '<div class="quiz"><h3>Подумай!</h3><p>' + esc(t.q) + '</p>' +
      '<button type="button" class="reveal">Показати відповідь</button><p class="ans" hidden>' + esc(t.a) + '</p></div>';
    card.hidden = false; card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
    body.querySelector('.reveal').addEventListener('click', function(){
      this.hidden = true; body.querySelector('.ans').hidden = false;
    });
    document.getElementById('cardClose').focus({preventScroll:true});
  }
  function closeCard(){ card.hidden = true; openIdx = -1; }
  document.getElementById('cardClose').addEventListener('click', closeCard);

  function activate(el){
    if (!el || !el.closest) return;
    if (el.closest('[data-start]')) { window.open(LESSON_URL, '_blank', 'noopener'); return; }
    var tp = el.closest('[data-topic]');
    if (tp) { var url = LINKS[tp.dataset.topic]; if (url) window.open(url, '_blank', 'noopener'); return; }
    var th = el.closest('[data-theme]');
    if (th) { var i = +th.getAttribute('data-theme'); if (i === openIdx) closeCard(); else openCard(i); return; }
    if (!card.hidden) closeCard();
  }

  var downT = null, sx = 0, sy = 0, ptrs = 0;
  vp.addEventListener('pointerdown', function(e){ ptrs++; if (ptrs > 1) { downT = null; return; } downT = e.target; sx = e.clientX; sy = e.clientY; }, true);
  function up(e){ ptrs = Math.max(0, ptrs - 1); window.__uiTap = !!(downT && downT.closest && downT.closest('.has-link,[data-theme],[data-start]')); if (!downT) return;
    if (e.type === 'pointerup' && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < 8) activate(downT);
    downT = null; }
  vp.addEventListener('pointerup', up, true);
  vp.addEventListener('pointercancel', up, true);
  vp.addEventListener('click', function(e){ if (e.detail === 0) activate(e.target); });

  addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !card.hidden) { closeCard(); e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
